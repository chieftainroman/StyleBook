<div class="ep-form-grid">

  <div class="ep-field ep-field-full">
    <label class="form-label">Service name <span class="text-red-500">*</span></label>
    <input class="form-input" type="text" name="name" required
           placeholder="e.g. Skin fade"
           value="{% if service %}{{ service.name }}{% endif %}">
  </div>

  <div class="ep-field">
    <label class="form-label">Duration (minutes) <span class="text-red-500">*</span></label>
    <input class="form-input" type="number" name="duration_minutes" required
           min="5" max="480" step="5" placeholder="e.g. 30"
           value="{% if service %}{{ service.duration_minutes }}{% endif %}">
  </div>

  <div class="ep-field">
    <label class="form-label">Price <span class="text-red-500">*</span></label>
    <input class="form-input" type="number" name="price" required
           min="0" max="100000" step="0.01" placeholder="e.g. 35.00"
           value="{% if service %}{{ service.price }}{% endif %}">
  </div>

  <div class="ep-field ep-field-full">
    <label class="form-label">Photo</label>
    <label class="svc-photo-zone ep-upload-zone {% if service.photo_url %}has-file{% endif %}"
           id="svcPhotoZone-{{ form_id }}">
      <input type="file" id="svcPhoto-{{ form_id }}"
             accept="image/*" style="display: none;">
      <img id="svcPhotoPreview-{{ form_id }}"
           src="{% if service.photo_url %}{{ service.photo_url }}{% endif %}"
           class="svc-photo-preview {% if not service.photo_url %}hidden{% endif %}"
           alt="">
      <div class="svc-photo-status ep-upload-title" id="svcPhotoStatus-{{ form_id }}">
        {% if service.photo_url %}Photo uploaded{% else %}Click to upload photo{% endif %}
      </div>
      <div class="svc-photo-hint ep-upload-hint">Max 5 MB</div>
    </label>
    <input type="hidden" name="photo_url" id="svcPhotoUrl-{{ form_id }}"
           value="{% if service %}{{ service.photo_url }}{% endif %}">
  </div>

  <div class="ep-field ep-field-full">
    <label class="form-label">Description</label>
    <textarea class="form-input" name="description" rows="2" maxlength="500"
              placeholder="What's included? Any special notes?">{% if service %}{{ service.description }}{% endif %}</textarea>
  </div>

</div>

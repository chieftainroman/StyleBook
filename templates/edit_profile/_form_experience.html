<div class="space-y-3">

  <div>
    <label class="form-label">Title <span class="text-red-500">*</span></label>
    <input class="form-input" type="text" name="title" required
           placeholder="e.g. Senior Barber"
           value="{% if exp %}{{ exp.title }}{% endif %}">
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="form-label">Studio / shop name</label>
      <input class="form-input" type="text" name="studio_name"
             placeholder="e.g. Iron & Comb"
             value="{% if exp %}{{ exp.studio_name }}{% endif %}">
    </div>
    <div>
      <label class="form-label">City</label>
      <input class="form-input" type="text" name="city"
             placeholder="e.g. Brooklyn"
             value="{% if exp %}{{ exp.city }}{% endif %}">
    </div>
  </div>

  <!-- Start date -->
  <div>
    <label class="form-label">Start date <span class="text-red-500">*</span></label>
    <div class="grid grid-cols-2 gap-3">
      <select class="form-input" name="start_month" required>
        <option value="">Month</option>
        {% for m in "123456789012"|make_list %}{% endfor %}
        {% for label in 'Jan,Feb,Mar,Apr,May,Jun,Jul,Aug,Sep,Oct,Nov,Dec'|split:',' %}{% endfor %}
        <option value="1"  {% if exp and exp.start_month == 1 %}selected{% endif %}>January</option>
        <option value="2"  {% if exp and exp.start_month == 2 %}selected{% endif %}>February</option>
        <option value="3"  {% if exp and exp.start_month == 3 %}selected{% endif %}>March</option>
        <option value="4"  {% if exp and exp.start_month == 4 %}selected{% endif %}>April</option>
        <option value="5"  {% if exp and exp.start_month == 5 %}selected{% endif %}>May</option>
        <option value="6"  {% if exp and exp.start_month == 6 %}selected{% endif %}>June</option>
        <option value="7"  {% if exp and exp.start_month == 7 %}selected{% endif %}>July</option>
        <option value="8"  {% if exp and exp.start_month == 8 %}selected{% endif %}>August</option>
        <option value="9"  {% if exp and exp.start_month == 9 %}selected{% endif %}>September</option>
        <option value="10" {% if exp and exp.start_month == 10 %}selected{% endif %}>October</option>
        <option value="11" {% if exp and exp.start_month == 11 %}selected{% endif %}>November</option>
        <option value="12" {% if exp and exp.start_month == 12 %}selected{% endif %}>December</option>
      </select>
      <input class="form-input" type="number" name="start_year" required
             min="1950" max="2100" placeholder="Year"
             value="{% if exp %}{{ exp.start_year }}{% endif %}">
    </div>
  </div>

  <!-- "Currently work here" checkbox -->
  <label class="flex items-center gap-3 cursor-pointer">
    <input type="checkbox" name="is_current"
           class="exp-current-toggle w-4 h-4 rounded border-cream-border"
           {% if exp and exp.is_current %}checked{% endif %}>
    <span class="text-sm text-ink">I currently work here</span>
  </label>

  <!-- End date -->
  <div>
    <label class="form-label">End date</label>
    <div class="grid grid-cols-2 gap-3">
      <select class="form-input exp-end-input" name="end_month"
              {% if exp and exp.is_current %}disabled{% endif %}>
        <option value="">Month</option>
        <option value="1"  {% if exp and exp.end_month == 1 %}selected{% endif %}>January</option>
        <option value="2"  {% if exp and exp.end_month == 2 %}selected{% endif %}>February</option>
        <option value="3"  {% if exp and exp.end_month == 3 %}selected{% endif %}>March</option>
        <option value="4"  {% if exp and exp.end_month == 4 %}selected{% endif %}>April</option>
        <option value="5"  {% if exp and exp.end_month == 5 %}selected{% endif %}>May</option>
        <option value="6"  {% if exp and exp.end_month == 6 %}selected{% endif %}>June</option>
        <option value="7"  {% if exp and exp.end_month == 7 %}selected{% endif %}>July</option>
        <option value="8"  {% if exp and exp.end_month == 8 %}selected{% endif %}>August</option>
        <option value="9"  {% if exp and exp.end_month == 9 %}selected{% endif %}>September</option>
        <option value="10" {% if exp and exp.end_month == 10 %}selected{% endif %}>October</option>
        <option value="11" {% if exp and exp.end_month == 11 %}selected{% endif %}>November</option>
        <option value="12" {% if exp and exp.end_month == 12 %}selected{% endif %}>December</option>
      </select>
      <input class="form-input exp-end-input" type="number" name="end_year"
             min="1950" max="2100" placeholder="Year"
             {% if exp and exp.is_current %}disabled{% endif %}
             value="{% if exp and exp.end_year %}{{ exp.end_year }}{% endif %}">
    </div>
  </div>

  <div>
    <label class="form-label">Description (optional)</label>
    <textarea class="form-input" name="description" rows="3"
              placeholder="What did you do there? Key achievements?">{% if exp %}{{ exp.description }}{% endif %}</textarea>
  </div>

</div>

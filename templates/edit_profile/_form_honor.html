<div class="space-y-3">

  <div>
    <label class="form-label">Honor title <span class="text-red-500">*</span></label>
    <input class="form-input" type="text" name="title" required
           placeholder="e.g. Best Barber NYC 2023"
           value="{% if honor %}{{ honor.title }}{% endif %}">
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="form-label">Issuer (optional)</label>
      <input class="form-input" type="text" name="issuer"
             placeholder="e.g. NYC Style Awards"
             value="{% if honor %}{{ honor.issuer }}{% endif %}">
    </div>
    <div>
      <label class="form-label">Year <span class="text-red-500">*</span></label>
      <input class="form-input" type="number" name="year" required
             min="1950" max="2100" placeholder="e.g. 2023"
             value="{% if honor %}{{ honor.year }}{% endif %}">
    </div>
  </div>

  <!-- Optional image upload -->
  <div>
    <label class="form-label">Image (optional)</label>
    <label class="honor-img-zone {% if honor.image_url %}has-file{% endif %}"
            id="honorImgZone-{{ form_id }}"
            style="display: block;">
        <input type="file" id="honorImg-{{ form_id }}"
                accept="image/*"
                style="display: none;">
      <img id="honorImgPreview-{{ form_id }}"
           src="{% if honor.image_url %}{{ honor.image_url }}{% endif %}"
           class="honor-img-preview {% if not honor.image_url %}hidden{% endif %}"
           alt="Honor preview">
      <div class="honor-img-status" id="honorImgStatus-{{ form_id }}">
        {% if honor.image_url %}
          ✓ Image attached
        {% else %}
          Click to upload image (optional)
        {% endif %}
      </div>
      <div class="honor-img-hint">Max 5 MB · Trophy photo or certificate scan</div>
    </label>
    <input type="hidden" name="image_url" id="honorImgUrl-{{ form_id }}"
           value="{% if honor %}{{ honor.image_url }}{% endif %}">
  </div>

  <div>
    <label class="form-label">Description (optional)</label>
    <textarea class="form-input" name="description" rows="3"
              placeholder="What was this award for?">{% if honor %}{{ honor.description }}{% endif %}</textarea>
  </div>

</div>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #FAFAF7; margin: 0; padding: 40px 20px; color: #1C1917; }
    .container { max-width: 480px; margin: 0 auto; background: #fff;
                 border: 1px solid #E5E3DC; border-radius: 14px; padding: 36px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .logo { font-size: 18px; font-weight: 600; margin-bottom: 24px; }
    .logo span { color: #C9A96E; }
    p { line-height: 1.6; margin: 12px 0; font-size: 14px; }
    .code {
      font-size: 38px; font-weight: 600; text-align: center;
      letter-spacing: 0.4em; padding: 22px;
      background: #FAFAF7; border: 1px dashed #C9A96E;
      border-radius: 12px; color: #1C1917;
      margin: 20px 0;
    }
    .footer { font-size: 12px; color: #888780; margin-top: 24px;
              padding-top: 18px; border-top: 1px solid #E5E3DC; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Style<span>Book</span></div>
    <h1>Verification code</h1>
    <p>Hi {{ booking.client_name }}, here's your code to confirm the booking with <strong>{{ master_name }}</strong>:</p>
    <div class="code">{{ code }}</div>
    <p>Enter it on the booking page. The code expires in 10 minutes.</p>
    <div class="footer">
      If you didn't request this booking, you can ignore this email.
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #F5F1E8;
      color: #0F0E0D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid #DED8CA;
      border-radius: 14px;
      padding: 34px;
    }

    .logo {
      margin-bottom: 24px;
      color: #0F0E0D;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .mark {
      display: inline-block;
      width: 28px;
      height: 28px;
      margin-right: 8px;
      border-radius: 7px;
      background: #3A3AFF;
      color: #FFFFFF;
      text-align: center;
      line-height: 28px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 8px;
      color: #0F0E0D;
      font-size: 22px;
      line-height: 1.2;
    }

    p {
      margin: 12px 0;
      color: #4F4A43;
      font-size: 14px;
      line-height: 1.6;
    }

    .code {
      margin: 22px 0;
      padding: 22px 14px;
      border: 1px dashed #3A3AFF;
      border-radius: 12px;
      background: #F5F1E8;
      color: #0F0E0D;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.28em;
    }

    .footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #DED8CA;
      color: #77736A;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span class="mark">S</span>Showpiece</div>

    <h1>Verification code</h1>
    <p>Hi {{ booking.client_name }}, use this code to confirm your booking with <strong>{{ master_name }}</strong>.</p>

    <div class="code">{{ code }}</div>

    <p>Enter this code on the booking page. It expires in 10 minutes.</p>

    <div class="footer">
      If you did not request this booking, you can ignore this email.
    </div>
  </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset link expired - Showpiece</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(58,58,255,0.12), transparent 30rem),
        #F5F1E8;
      color: #0F0E0D;
      font-family: 'Space Grotesk', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(460px, 100%);
      background: #FFFFFF;
      border: 1px solid #DED8CA;
      border-radius: 12px;
      padding: 34px;
      text-align: center;
      box-shadow: 0 22px 80px rgba(15,14,13,0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #0F0E0D;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #3A3AFF;
      color: #FFFFFF;
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      font-weight: 400;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      display: inline-grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #DC2626;
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      color: #0F0E0D;
      font-family: 'Anton', sans-serif;
      font-size: 42px;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #77736A;
      font-size: 14px;
      line-height: 1.6;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-primary {
      background: #3A3AFF;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #2929E8;
    }

    .btn-ghost {
      background: #FFFFFF;
      color: #0F0E0D;
      border: 1px solid #DED8CA;
    }

    .btn-ghost:hover {
      border-color: #0F0E0D;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
        align-items: start;
      }

      .card {
        padding: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <a href="/" class="brand">
      <span class="brand-mark">S</span>
      <span>Showpiece</span>
    </a>

    <div class="icon-wrap">X</div>

    <h1>Link expired</h1>
    <p>This password reset link is invalid or expired. Request a new link to reset your password.</p>

    <div class="actions">
      <a href="{% url 'forgot_password' %}" class="btn btn-primary">Request new reset link</a>
      <a href="{% url 'login' %}" class="btn btn-ghost">Back to login</a>
    </div>
  </main>
</body>
</html>

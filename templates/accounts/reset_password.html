{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set new password — StyleBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #FAFAF7; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 400px; width: 100%; background: #fff; border: 1px solid #E5E3DC;
            border-radius: 16px; padding: 36px; }
    .logo { font-size: 18px; font-weight: 600; margin-bottom: 28px; text-align: center; }
    .logo span { color: #C9A96E; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 24px; color: #1C1917; }
    label { display: block; font-size: 12px; font-weight: 500; color: #888780;
            margin-bottom: 6px; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #E5E3DC; border-radius: 8px;
            font-size: 14px; outline: none; }
    input:focus { border-color: #1C1917; }
    .btn { width: 100%; margin-top: 18px; padding: 12px;
           background: #C9A96E; color: #1C1917; border: none;
           border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn:hover { background: #8B6914; color: #fff; }
    .flash { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .flash-error { background: #FEE2E2; color: #991B1B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Style<span>Book</span></div>

    {% if messages %}
      {% for m in messages %}
        <div class="flash flash-{{ m.tags|default:'info' }}">{{ m }}</div>
      {% endfor %}
    {% endif %}

    <h1>Set new password</h1>

    <form method="POST">
      {% csrf_token %}
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" required minlength="8">

      <label for="new_password2">Confirm new password</label>
      <input type="password" id="new_password2" name="new_password2" required minlength="8">

      <button type="submit" class="btn">Update password</button>
    </form>
  </div>
</body>
</html>

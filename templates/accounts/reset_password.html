{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password - Showpiece</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(58,58,255,0.12), transparent 30rem),
        #F5F1E8;
      color: #0F0E0D;
      font-family: 'Space Grotesk', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: #FFFFFF;
      border: 1px solid #DED8CA;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 22px 80px rgba(15,14,13,0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #0F0E0D;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #3A3AFF;
      color: #FFFFFF;
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      font-weight: 400;
    }

    h1 {
      margin: 0 0 24px;
      color: #0F0E0D;
      font-family: 'Anton', sans-serif;
      font-size: 42px;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #77736A;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #DED8CA;
      border-radius: 8px;
      background: #FFFFFF;
      color: #0F0E0D;
      padding: 11px 14px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #3A3AFF;
      box-shadow: 0 0 0 3px rgba(58,58,255,0.12);
    }

    .btn {
      width: 100%;
      min-height: 46px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #3A3AFF;
      color: #FFFFFF;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .btn:hover {
      background: #2929E8;
    }

    .flash {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .flash-error {
      background: #FEF2F2;
      color: #B91C1C;
      border: 1px solid #FECACA;
    }

    .flash-success {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
    }

    .flash-info {
      background: rgba(58,58,255,0.08);
      color: #2929E8;
      border: 1px solid rgba(58,58,255,0.16);
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
        align-items: start;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <a href="/" class="brand">
      <span class="brand-mark">S</span>
      <span>Showpiece</span>
    </a>

    {% if messages %}
      {% for m in messages %}
        <div class="flash flash-{{ m.tags|default:'info' }}">{{ m }}</div>
      {% endfor %}
    {% endif %}

    <h1>Set new password</h1>

    <form method="POST">
      {% csrf_token %}

      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" required minlength="8">

      <label for="new_password2">Confirm new password</label>
      <input type="password" id="new_password2" name="new_password2" required minlength="8">

      <button type="submit" class="btn">Update password</button>
    </form>
  </main>
</body>
</html>

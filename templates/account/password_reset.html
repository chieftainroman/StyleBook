{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — StyleBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        sidebar: '#1C1917', cream: '#FAFAF7', 'cream-card': '#FFFFFF',
        'cream-border': '#E5E3DC', gold: '#C9A96E', 'gold-light': '#F5EDD8',
        'gold-dark': '#8B6914', ink: '#1C1917', muted: '#888780',
      }, fontFamily: { sans: ['Inter','sans-serif'], serif: ['Instrument Serif','serif'] } } }
    }
  </script>
  <style>
    .form-input {
      display: block; width: 100%;
      background: #fff; border: 1px solid #E5E3DC;
      border-radius: 8px; padding: 10px 14px;
      font-size: 14px; color: #1C1917;
      outline: none; transition: border-color .15s;
      font-family: inherit;
    }
    .form-input:focus { border-color: #1C1917; }
    .form-input::placeholder { color: #888780; }
  </style>
</head>
<body class="bg-cream font-sans antialiased min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-semibold">
        <span class="text-ink">Style</span><span class="text-gold">Book</span>
      </a>
    </div>
    <div class="bg-cream-card border border-cream-border rounded-2xl p-8">
      <div class="w-12 h-12 rounded-full bg-gold-light flex items-center
                  justify-center mx-auto mb-4">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2"
                stroke="#8B6914" stroke-width="1.5"/>
          <path d="M7 11V7a5 5 0 0110 0v4"
                stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-ink text-center mb-1">
        Forgot your password?
      </h1>
      <p class="text-sm text-muted text-center mb-6 leading-relaxed">
        Enter your email and we'll send you a link to reset your password.
      </p>

      <form method="POST" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block text-xs font-medium text-muted uppercase
                        tracking-wide mb-1.5">
            Email address
          </label>
          <input class="form-input" type="email" name="email"
                 placeholder="you@email.com" required autofocus>
        </div>
        <button type="submit"
                class="w-full bg-ink text-white text-sm font-medium
                       py-3 rounded-lg hover:bg-sidebar transition-colors">
          Send reset link
        </button>
      </form>

      <a href="/auth/login/"
         class="block text-center text-xs text-muted hover:text-ink
                transition-colors mt-4">
        ← Back to sign in
      </a>
    </div>
  </div>
</body>
</html>

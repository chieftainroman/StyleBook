{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — StyleBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        sidebar: '#1C1917', cream: '#FAFAF7', 'cream-card': '#FFFFFF',
        'cream-border': '#E5E3DC', gold: '#C9A96E', 'gold-light': '#F5EDD8',
        'gold-dark': '#8B6914', ink: '#1C1917', muted: '#888780',
      }, fontFamily: { sans: ['Inter','sans-serif'], serif: ['Instrument Serif','serif'] } } }
    }
  </script>
  <style>
    .form-input {
      display: block; width: 100%;
      background: #fff; border: 1px solid #E5E3DC;
      border-radius: 8px; padding: 10px 14px;
      font-size: 14px; color: #1C1917;
      outline: none; transition: border-color .15s;
      font-family: inherit;
    }
    .form-input:focus { border-color: #1C1917; }
    .form-input::placeholder { color: #888780; }
  </style>
</head>
<body class="bg-cream font-sans antialiased min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-semibold">
        <span class="text-ink">Style</span><span class="text-gold">Book</span>
      </a>
    </div>
    <div class="bg-cream-card border border-cream-border rounded-2xl p-8">
      <h1 class="text-xl font-semibold text-ink text-center mb-1">
        Set new password
      </h1>
      <p class="text-sm text-muted text-center mb-6">
        Choose a strong password for your account
      </p>

      {% if token_fail %}
        <div class="bg-red-50 border border-red-100 rounded-lg px-4 py-3
                    text-sm text-red-700 mb-4">
          This reset link is invalid or has expired.
          <a href="{% url 'account_reset_password' %}"
             class="font-medium underline ml-1">
            Request a new one
          </a>
        </div>
      {% else %}
        <form method="POST">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit"
                  class="w-full bg-ink text-white text-sm font-medium
                         py-3 rounded-lg hover:bg-sidebar transition-colors mt-2">
            Set new password
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</body>
</html>

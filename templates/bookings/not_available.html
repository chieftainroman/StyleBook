{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Not accepting bookings — StyleBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #FAFAF7; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 440px; width: 100%; background: #fff; border: 1px solid #E5E3DC;
            border-radius: 16px; padding: 40px; text-align: center; }
    .icon { font-size: 36px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 10px; color: #1C1917; }
    p { color: #555; line-height: 1.55; font-size: 14px; }
    .btn { display: inline-block; margin-top: 20px; padding: 11px 24px;
           background: #1C1917; color: #fff; text-decoration: none;
           border-radius: 8px; font-weight: 500; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏸️</div>
    <h1>Not accepting bookings yet</h1>
    <p><strong>{{ master.username }}</strong> hasn't set up bookings on StyleBook yet.</p>
    <a href="/profile/{{ master.username }}/" class="btn">View profile →</a>
  </div>
</body>
</html>

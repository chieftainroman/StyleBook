{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelled - Showpiece</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(58,58,255,0.12), transparent 30rem),
        #F5F1E8;
      color: #0F0E0D;
      font-family: 'Space Grotesk', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(440px, 100%);
      background: #FFFFFF;
      border: 1px solid #DED8CA;
      border-radius: 12px;
      padding: 34px;
      text-align: center;
      box-shadow: 0 22px 80px rgba(15,14,13,0.12);
    }

    .mark {
      width: 58px;
      height: 58px;
      display: inline-grid;
      place-items: center;
      margin-bottom: 16px;
      border-radius: 12px;
      background: #0F0E0D;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      color: #0F0E0D;
      font-family: 'Anton', sans-serif;
      font-size: 42px;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    p {
      margin: 10px 0;
      color: #77736A;
      font-size: 14px;
      line-height: 1.6;
    }

    .ref {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 7px;
      background: #F5F1E8;
      color: #0F0E0D;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      margin-top: 16px;
      padding: 11px 20px;
      border-radius: 8px;
      background: #3A3AFF;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .btn:hover {
      background: #2929E8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">X</div>
    <h1>Booking cancelled</h1>
    <p>
      Your booking <span class="ref">{{ booking.reference_code }}</span>
      with {{ booking.master.user.username }} has been cancelled. We have notified them.
    </p>
    <a href="/book/{{ booking.master.user.username }}/" class="btn">Book again &rarr;</a>
  </main>
</body>
</html>

{% extends 'base.html' %}

{% block content %}
<div class="px-8 py-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <div>
      <h1 class="text-2xl font-serif italic text-ink">Reservations</h1>
      <p class="text-sm text-muted mt-1">
        Manage your appointments and client bookings.
      </p>
    </div>

    <!-- View toggle -->
    <div class="inline-flex items-center bg-white border border-cream-border rounded-lg p-1">
      <a href="?view=list{% if tab != 'upcoming' %}&tab={{ tab }}{% endif %}"
         class="px-3 py-1.5 text-xs font-medium rounded transition-colors flex items-center gap-1.5
                {% if view_mode == 'list' %}bg-ink text-white{% else %}text-muted hover:text-ink{% endif %}">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        List
      </a>
      <a href="?view=calendar"
         class="px-3 py-1.5 text-xs font-medium rounded transition-colors flex items-center gap-1.5
                {% if view_mode == 'calendar' %}bg-ink text-white{% else %}text-muted hover:text-ink{% endif %}">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="3" width="12" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="6" x2="14" y2="6" stroke="currentColor" stroke-width="1.5"/>
          <line x1="5" y1="2" x2="5" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11" y1="2" x2="11" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Calendar
      </a>
    </div>
  </div>

  {% if view_mode == 'list' %}
    {% include 'bookings/_reservations_list.html' %}
  {% else %}
    {% include 'bookings/_reservations_calendar.html' %}
  {% endif %}

</div>
{% endblock %}

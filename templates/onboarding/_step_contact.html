{% load dict_filters %}

<p class="ob-step-sub">How can clients reach you? Set your working hours so clients know when you're available.</p>

<form method="POST" action="{% url 'onboarding_step_save' step=5 %}" class="space-y-5">
  {% csrf_token %}

  <!-- Phone (required) -->
  <div>
    <label class="block text-xs font-medium text-muted uppercase tracking-wider mb-1.5"
           for="phone">Phone <span class="text-red-500">*</span></label>
    <input id="phone" name="phone" type="tel" required
           placeholder="+1 555 123 4567"
           value="{{ profile.phone }}"
           class="w-full px-3 py-2.5 border border-cream-border rounded-lg text-sm
                  focus:outline-none focus:border-ink bg-white">
  </div>

  <!-- IG handle (optional) -->
  <div>
    <label class="block text-xs font-medium text-muted uppercase tracking-wider mb-1.5"
           for="ig_handle">Instagram handle (optional)</label>
    <input id="ig_handle" name="ig_handle" type="text"
           placeholder="yourname (without @)"
           value="{{ profile.ig_handle }}"
           class="w-full px-3 py-2.5 border border-cream-border rounded-lg text-sm
                  focus:outline-none focus:border-ink bg-white">
  </div>

  <!-- Working hours (optional in wizard — can edit later) -->
  <div>
    <p class="text-xs font-medium text-muted uppercase tracking-wider mb-2">Working hours (optional)</p>
    <p class="text-xs text-muted mb-3">You can fine-tune these later from your profile edit page.</p>
    <div class="space-y-1.5">
      {% for day_key, day_label in days %}
        <div class="hours-row grid grid-cols-12 gap-2 items-center text-sm">
          <div class="col-span-3 text-ink font-medium">{{ day_label }}</div>
          <div class="col-span-3">
            <input type="time" name="{{ day_key }}_open"
                   class="w-full px-2 py-1.5 border border-cream-border rounded text-xs bg-white"
                   value="{{ working_hours|get_item:day_key|get_item:'open' }}"
                   {% if working_hours|get_item:day_key|get_item:'closed' %}disabled{% endif %}>
          </div>
          <div class="col-span-1 text-center text-xs text-muted">to</div>
          <div class="col-span-3">
            <input type="time" name="{{ day_key }}_close"
                   class="w-full px-2 py-1.5 border border-cream-border rounded text-xs bg-white"
                   value="{{ working_hours|get_item:day_key|get_item:'close' }}"
                   {% if working_hours|get_item:day_key|get_item:'closed' %}disabled{% endif %}>
          </div>
          <div class="col-span-2 text-right">
            <label class="text-xs text-muted inline-flex items-center gap-1 cursor-pointer">
              <input type="checkbox" name="{{ day_key }}_closed"
                     class="closed-toggle w-3 h-3"
                     {% if working_hours|get_item:day_key|get_item:'closed' %}checked{% endif %}>
              Off
            </label>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="ob-actions">
    <a href="?step=4" class="ob-btn ob-btn-ghost">← Back</a>
    <button type="submit" class="ob-btn ob-btn-primary">Finish setup ✓</button>
  </div>
</form>

<script>
  document.querySelectorAll('.closed-toggle').forEach(cb => {
    cb.addEventListener('change', e => {
      const row = e.target.closest('.hours-row');
      row.querySelectorAll('input[type="time"]').forEach(t => {
        t.disabled = e.target.checked;
      });
    });
  });
</script>
